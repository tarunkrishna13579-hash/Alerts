name: job-watch

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'state/**'
  schedule:
    - cron: "4-59/10 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "selftest = check every company and send a report; normal = look for jobs"
        type: choice
        default: selftest
        options: [selftest, normal]
