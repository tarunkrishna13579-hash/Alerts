name: job-watch
on:
  schedule:
    - cron: "4-59/10 * * * *"   # minutes 4,14,24,... (avoids the busy :00/:10 slots)
  workflow_dispatch:
    inputs:
      mode:
        description: "selftest = check every company and send a report; normal = look for jobs"
        type: choice
        default: selftest
        options: [selftest, normal]
permissions:
  contents: write
concurrency:
  group: watch
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python test_watcher.py
      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "$MODE" = "selftest" ]; then python watcher.py --selftest; else python watcher.py; fi
      - name: Save state
        run: |
          git config user.name "job-watch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase -q && git push)
