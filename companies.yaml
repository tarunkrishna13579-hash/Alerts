# =====================================================================
#  EDIT ONLY THIS FILE. Everything else just runs.
# =====================================================================
filters:
  # Job title must contain one of these (lowercase) ...
  include_title: [java, backend, back end, back-end, software engineer,
                  software development engineer, sde, software developer,
                  member of technical staff, mts, application developer,
                  developer, engineer]
  # ... and none of these:
  exclude_title: [senior, sr., "sr ", lead, principal, staff, architect, manager,
                  director, head of, intern, "vp ", vice president, distinguished,
                  fellow, frontend, front end, front-end, qa, tester, sdet,
                  test engineer, data scientist, devops, sre, security analyst,
                  business analyst, support engineer, sales, ios, android,
                  mainframe, sap abap, salesforce, .net, python developer,
                  data engineer, machine learning, hardware, firmware, asic, rtl]
  locations: [bangalore, bengaluru, hyderabad]
  max_age_days: 14          # ignore postings older than this (also limits the first-run backlog)
  search_terms: [java, software engineer, backend]

experience:
  my_years: 2               # your experience
  max_min_years: 2          # accept a job only if its MINIMUM required years is <= this
                            # (2 -> accepts 0-3, 1-3, 2-4, 2-5, "2+"; rejects 3-5, "3+"). Change to 3 to be looser.
  send_if_unknown: true     # JD doesn't state years -> still alert, marked "not stated"

skills:
  must_have: Java
  min_other_hits: 1         # plus at least this many of: Spring Boot, Microservices, REST, Multithreading, Kafka, Hibernate/JPA

