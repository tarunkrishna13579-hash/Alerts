# =====================================================================
#  EDIT ONLY THIS FILE. Everything else just runs.
# =====================================================================
filters:
  use_title_filter: false   # false = ignore job titles; the job qualifies if its description asks for Java (+ city, age, experience checks)
  # Job title must contain one of these (lowercase) ...
  include_title: [java, backend, back end, back-end, software engineer,
                  software development engineer, sde, software developer,
                  member of technical staff, mts, application developer,
                  developer, engineer, programmer, consultant]
  # ... and none of these:
  exclude_title: [senior, sr., "sr ", lead, principal, staff, architect, manager,
                  director, head of, intern, "vp ", vice president, distinguished,
                  fellow, frontend, front end, front-end, qa, tester, sdet,
                  test engineer, data scientist, devops, sre, security analyst,
                  business analyst, support engineer, sales, ios, android,
                  mainframe, sap abap, salesforce, .net, python developer,
                  data engineer, machine learning, hardware, firmware, asic, rtl]
  locations: [bangalore, bengaluru, hyderabad]
  max_age_days: 2           # only jobs posted today / yesterday / 2 days ago (older ones are ignored)
  search_terms: [java, java hyderabad, java bengaluru, software engineer hyderabad, software engineer bengaluru, backend]

repost_alert: false          # true = also alert when an already-sent job is re-listed (default: never re-send)

report:
  digest_hours_ist: [10, 16, 23]   # status report with counts at these hours (IST)
  every_hours: 4        # if no job alert was sent for this long, you get a "no new jobs" message
  quiet_start: 23       # no such messages between 11pm and 7am IST
  quiet_end: 7

experience:
  my_years: 2.2             # your experience (years)
  tolerance: 0              # overall minimum may exceed my_years by this much (0 = "3+ years" is rejected, "2+" accepted)
  range_slack: 0.5          # a range like 0-2 still counts if its top is within this of my_years
  skill_checks: info        # info = skill years (e.g. "3+ years Java") are shown in the alert but NEVER decide; strict = they can reject a job
  skill_tolerance: 0.0      # no free allowance: a MANDATORY skill requirement above your recorded years in that skill is rejected
  skill_years:              # YOUR recorded years per skill. Taken from your Oracle FLEXCUBE role (since Aug 2024) - please confirm or correct each number.
    Java: 2.2               # A mandatory requirement for a skill that is NOT listed here becomes NEEDS_REVIEW (or ineligible if it is more
    Spring Boot: 2.2        # than your 2.2 total years). Add skills here (e.g. SQL: 2.0) when you are sure of the years.
    Spring: 2.2
    Microservices: 2.2
    Kafka: 2.2
    Redis: 2.2

skills:
  must_have: Java
  min_other_hits: 0         # 0 = any job that asks for Java is OK (set 1 to also require Spring/REST/etc.)

